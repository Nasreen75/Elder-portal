<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elder Care - Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding-left: 4%;
            min-height: 100vh;
        }

        /* Card width increased from 380px to 450px */
        .register-wrapper {
            width: 100%;
            max-width: 450px;
            margin-top: 25px;
            margin-bottom: 25px;
        }

        .register-card {
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
            padding: 24px !important;
        }

        /* Inputs & text size enhanced */
        .form-control, .form-select {
            padding: 10px 14px;
            font-size: 0.95rem;
            border-radius: 10px;
        }

        .form-label {
            font-size: 0.9rem !important;
            margin-bottom: 4px;
        }

        .bio-reg-btn {
            background: linear-gradient(135deg, #17a2b8, #20c997);
            border: none;
            font-weight: bold;
            border-radius: 10px;
            padding: 10px;
            font-size: 0.95rem !important;
        }

        @media (max-width: 768px) {
            body {
                justify-content: center;
                padding-left: 0;
            }
        }
    </style>
</head>
<body>

<!-- Background Image -->
<img src="images/bg-eldercare.png" class="bg-image" alt="Background">

<div class="register-wrapper">
    <div class="card register-card">

        <div class="text-center mb-3 text-primary">
            <i class="fa-solid fa-user-plus fa-25x mb-1" style="font-size: 2.2rem;"></i>
            <h3 class="fw-bold mb-0">Create Account</h3>
            <small class="text-muted" style="font-size: 0.9rem;">Register Caregiver & Parent Profile</small>
        </div>

        <form id="registerForm" onsubmit="handleRegistration(event)">

            <div class="mb-3 text-start">
                <label class="form-label fw-semibold">Full Name</label>
                <input type="text" id="regName" class="form-control" placeholder="e.g. Rahul Sharma" required>
            </div>

            <div class="mb-3 text-start">
                <label class="form-label fw-semibold">Email Address</label>
                <input type="email" id="regEmail" class="form-control" placeholder="caregiver@example.com" required>
            </div>

            <div class="mb-3 text-start">
                <label class="form-label fw-semibold">Password</label>
                <input type="password" id="regPassword" class="form-control" placeholder="Create Password" required>
            </div>

            <div class="mb-3 text-start">
                <label class="form-label fw-semibold">Account Role</label>
                <select id="regRole" class="form-select" required>
                    <option value="CAREGIVER">Caregiver / Child</option>
                    <option value="PARENT">Parent / Patient</option>
                </select>
            </div>

            <!-- BIOMETRIC ENROLLMENT FOR PARENTS -->
            <div class="p-3 bg-light rounded-3 my-3 border text-center">
                <small class="text-secondary fw-bold d-block mb-2" style="font-size: 0.88rem;">
                    <i class="fa-solid fa-fingerprint me-1"></i> Parent Biometrics Setup
                </small>
                <button type="button" onclick="registerBiometrics()" class="btn btn-info text-white bio-reg-btn w-100">
                    <i class="fa-solid fa-id-card me-1"></i> Link Fingerprint / Face ID
                </button>
                <small id="bioStatus" class="text-success d-block mt-2 fw-bold" style="font-size: 0.8rem;"></small>
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold py-2 fs-6 mt-1">
                <i class="fa-solid fa-check-circle me-1"></i> Complete Registration
            </button>
        </form>

        <div class="mt-3 text-center">
            <small class="text-muted" style="font-size: 0.88rem;">
                Already have an account? <a href="login.html" class="fw-bold text-decoration-none">Login Here</a>
            </small>
        </div>

    </div>
</div>

<script>
    async function registerBiometrics() {
        if (!window.PublicKeyCredential) {
            alert("Biometrics (Face ID / Fingerprint) is not supported on this browser.");
            return;
        }

        try {
            const publicKeyCredentialCreationOptions = {
                challenge: new Uint8Array([9, 8, 7, 6, 5, 4, 3, 2]),
                rp: { name: "Elder Care App" },
                user: {
                    id: new Uint8Array(16),
                    name: document.getElementById("regEmail").value || "parent@eldercare.com",
                    displayName: document.getElementById("regName").value || "Parent Profile"
                },
                pubKeyCredParams: [{ alg: -7, type: "public-key" }],
                authenticatorSelection: { authenticatorAttachment: "platform" },
                timeout: 60000
            };

            const credential = await navigator.credentials.create({ publicKey: publicKeyCredentialCreationOptions });

            if (credential) {
                document.getElementById("bioStatus").innerText = "✓ Biometrics Linked!";
            }
        } catch (err) {
            if (confirm("Simulate linking Fingerprint/Face ID scanner for Demo?")) {
                document.getElementById("bioStatus").innerText = "✓ Biometrics Linked!";
            }
        }
    }

    function handleRegistration(event) {
        event.preventDefault();
        alert("Account registered successfully! Redirecting to Login...");
        window.location.href = "login.html";
    }
</script>
</body>
</html>
