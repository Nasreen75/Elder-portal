<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elder Care - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Full page background image styling */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding-left: 4%;
            min-height: 100vh;
        }

        /* Responsive & clear card width */
        .login-wrapper {
            width: 100%;
            max-width: 450px;
            margin-top: 25px;
            margin-bottom: 25px;
        }

        .login-card {
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
            padding: 28px !important;
        }

        .form-control, .form-select {
            padding: 10px 14px;
            font-size: 0.95rem;
            border-radius: 10px;
        }

        .form-label {
            font-size: 0.9rem !important;
            margin-bottom: 4px;
        }

        .bio-btn {
            background: linear-gradient(135deg, #20c997, #17a2b8);
            border: none;
            font-weight: bold;
            border-radius: 10px;
            padding: 10px;
            font-size: 0.95rem !important;
        }

        @media (max-width: 768px) {
            body {
                justify-content: center;
                padding-left: 0;
            }
        }
    </style>
</head>
<body>

<!-- Background Image -->
<img src="images/bg-eldercare.png" class="bg-image" alt="Background">

<div class="login-wrapper">
    <div class="card login-card">

        <div class="text-center mb-4 text-primary">
            <i class="fa-solid fa-right-to-bracket fa-2x mb-1" style="font-size: 2.2rem;"></i>
            <h3 class="fw-bold mb-0">Welcome Back</h3>
            <small class="text-muted" style="font-size: 0.9rem;">Elder Care & Reminders Portal</small>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">

            <div class="mb-3 text-start">
                <label class="form-label fw-semibold">Email Address</label>
                <input type="email" id="loginEmail" class="form-control" placeholder="enter your email" required>
            </div>

            <div class="mb-3 text-start">
                <label class="form-label fw-semibold">Password</label>
                <input type="password" id="loginPassword" class="form-control" placeholder="enter your password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold py-2 fs-6 mt-2 mb-3">
                <i class="fa-solid fa-sign-in-alt me-1"></i> Log In
            </button>
        </form>

        <!-- BIOMETRIC LOGIN FOR PARENTS -->
        <div class="p-3 bg-light rounded-3 my-2 border text-center">
            <small class="text-secondary fw-bold d-block mb-2" style="font-size: 0.88rem;">
                <i class="fa-solid fa-fingerprint me-1"></i> Quick Parent Login
            </small>
            <button type="button" onclick="loginWithBiometrics()" class="btn btn-info text-white bio-btn w-100">
                <i class="fa-solid fa-face-smile me-1"></i> Login with Fingerprint / Face ID
            </button>
        </div>

        <div class="mt-3 text-center">
            <small class="text-muted" style="font-size: 0.88rem;">
                Don't have an account? <a href="register.html" class="fw-bold text-decoration-none">Register Here</a>
            </small>
        </div>

    </div>
</div>

<script>
    async function loginWithBiometrics() {
        if (!window.PublicKeyCredential) {
            alert("Biometrics (Face ID / Fingerprint) is not supported on this browser.");
            return;
        }

        try {
            const publicKeyCredentialRequestOptions = {
                challenge: new Uint8Array([1, 2, 3, 4, 5, 6, 7, 8]),
                timeout: 60000
            };

            const assertion = await navigator.credentials.get({ publicKey: publicKeyCredentialRequestOptions });

            if (assertion) {
                alert("Biometric verification successful! Redirecting...");
                window.location.href = "dashboard.html";
            }
        } catch (err) {
            if (confirm("Simulate Fingerprint/Face ID verification for Demo?")) {
                alert("Biometric verification successful! Redirecting...");
                window.location.href = "dashboard.html";
            }
        }
    }

    function handleLogin(event) {
        event.preventDefault();
        alert("Login successful!");
        window.location.href = "dashboard.html";
    }
</script>
</body>
</html>
